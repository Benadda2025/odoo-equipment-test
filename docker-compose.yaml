version: '3.8'
services:
    web:
        image: odoo:18.0
        depends_on:
            - mydb
        ports:
            - "8069:8069"
        environment:
        - HOST=mydb
        - USER=odoo
        - PASSWORD=myodoo
        volumes:
            - odoo-web-data:/var/lib/odoo
            - ./config:/etc/odoo
            - ./addons:/mnt/extra-addons
    mydb:
        image: postgres:15
        environment:
            - POSTGRES_DB=postgres
            - POSTGRES_PASSWORD=myodoo
            - POSTGRES_USER=odoo

volumes:
    odoo-web-data:
    odoo-db-data:
